run:
  timeout: 5m
  go: '1.22'

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - misspell
    - revive
    - gosec
    - bodyclose
    - unconvert
    - goconst
    - nakedret

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: false
  goconst:
    min-occurrences: 4
  gosec:
    excludes:
      # Backoff jitter is not a cryptographic decision.
      - G404

issues:
  exclude-rules:
    # Test helpers legitimately ignore errors while setting up fixtures, and
    # requiring a check on every one of them makes the tests harder to read
    # without making them more correct.
    - path: _test\.go
      linters:
        - errcheck
        - goconst
        - gosec
  max-issues-per-linter: 0
  max-same-issues: 0
