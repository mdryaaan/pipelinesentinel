name: CI

on:
  push:
    branches: [main]
  pull_request:

# The repository this tool audits should pass its own rules, so the token is
# scoped as narrowly as the tool asks everyone else to scope theirs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: '1.22'
          cache: true

      - name: Verify the module is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: '1.22'

      - uses: golangci/golangci-lint-action@971e284b6050e8a5849b72094c50ab08da042db8 # v6.1.1
        with:
          version: v1.61.0

  eval:
    name: Evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: '1.22'

      - name: Build
        run: go build -o bin/pipelinesentinel .

      # The corpus is a regression suite: it was written alongside the rules, so
      # a drop below the gate means a rule changed behaviour, not that the
      # workflows in the wild got harder.
      - name: Score the labelled corpus
        run: ./bin/pipelinesentinel eval --min-score 1.0 --format markdown >> "$GITHUB_STEP_SUMMARY"

  self-audit:
    name: Audit our own workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: '1.22'

      - name: Build
        run: go build -o bin/pipelinesentinel .

      # A workflow auditor whose own workflows fail its rules is not a tool
      # anyone should trust, so this job is the real test of the ruleset.
      - name: Audit
        run: ./bin/pipelinesentinel audit . --fail-on medium --format markdown >> "$GITHUB_STEP_SUMMARY"
