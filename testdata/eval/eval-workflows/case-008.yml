name: Build
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Report the build
        run: echo "building ${{ github.repository }} at ${{ github.sha }} (run ${{ github.run_id }})"
