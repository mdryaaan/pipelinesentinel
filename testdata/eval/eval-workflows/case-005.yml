name: Changelog
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Append to the changelog
        run: echo "${{ github.event.head_commit.message }}" >> CHANGELOG.md
