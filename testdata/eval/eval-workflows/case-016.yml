name: Comment on the build
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v4.1.8
        with:
          run-id: ${{ github.event.workflow_run.id }}
      - name: Post the result
        env:
          RESULT_PATH: result.txt
        run: ./scripts/comment.sh "$RESULT_PATH"
