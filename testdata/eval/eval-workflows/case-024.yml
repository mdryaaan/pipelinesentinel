name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@11bd71901bbe5b1630ceea73d27597364c9af683 # v3.3.0
        with:
          registry: ghcr.io
          username: ci
          password: ${{ secrets.REGISTRY_PASSWORD }}
