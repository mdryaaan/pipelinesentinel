name: Manual deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Deploy
        run: ./deploy.sh --env "${{ github.event.inputs.environment }}"
